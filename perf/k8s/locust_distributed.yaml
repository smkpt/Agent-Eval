apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  labels:
    role: locust-master
spec:
  replicas: 1
  selector:
    matchLabels:
      role: locust-master
  template:
    metadata:
      labels:
        role: locust-master
    spec:
      containers:
        - name: locust-master
          image: locustio/locust:latest
          args: ["-f", "/mnt/locust/locustfile.py", "--master", "-H", "http://healthcare-agent-service:8000"]
          ports:
            - containerPort: 8089
              name: web-ui
            - containerPort: 5557
              name: comm-1
            - containerPort: 5558
              name: comm-2
          volumeMounts:
            - name: locust-scripts
              mountPath: /mnt/locust
      volumes:
        - name: locust-scripts
          configMap:
            name: locust-script-cm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  labels:
    role: locust-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      role: locust-worker
  template:
    metadata:
      labels:
        role: locust-worker
    spec:
      containers:
        - name: locust-worker
          image: locustio/locust:latest
          args: ["-f", "/mnt/locust/locustfile.py", "--worker", "--master-host", "locust-master"]
          volumeMounts:
            - name: locust-scripts
              mountPath: /mnt/locust
      volumes:
        - name: locust-scripts
          configMap:
            name: locust-script-cm
