name: Healthcare Agent CI/CD, DeepEval & Performance Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  agent-validation:
    name: Guardrail Evaluation, Performance Benchmarks & Load Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PHI Masking & Telemetry Sanitization
        run: |
          python -m pytest tests/test_phi_masking.py -v

      - name: Verify Multi-Tier Data Integrity across MongoDB, Postgres, and DB2
        run: |
          python -m pytest tests/test_data_integrity.py -v

      - name: Verify Asynchronous Pharmacy & Prior Auth (HTTP 202)
        run: |
          python -m pytest tests/test_async_workflow.py -v

      - name: Execute DeepEval Guardrails & Clinical Validations
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pytest tests/test_deepeval_guardrails.py -v

      - name: Verify Telemetry, Metrics & Prometheus Exporter
        run: |
          python -m pytest tests/test_telemetry_metrics.py -v

      - name: Verify Component Health Probes & Diagnostics
        run: |
          python -m pytest tests/test_component_health.py -v

      - name: Verify Operational Alerting Rules Engine
        run: |
          python -m pytest tests/test_alerts.py -v

      - name: Verify Synthetic Canary Traffic & SLA
        run: |
          python -m pytest tests/test_synthetic_canary.py -v

      - name: Run Multi-Agent Performance & Load Benchmarks
        run: |
          python -m pytest tests/test_performance.py -v

      - name: Verify FastAPI Endpoints for Load Testing
        run: |
          python -m pytest tests/test_api_endpoints.py -v

      - name: Execute Full Universal Test Suite (30 Tests)
        run: |
          python run_tests.py

      - name: Execute Headless Locust Load Test (Local Server Simulation)
        run: |
          python -c "
          import uvicorn, threading, time
          from src.api.app import app
          server = uvicorn.Server(uvicorn.Config(app, host='127.0.0.1', port=8000, log_level='error'))
          t = threading.Thread(target=server.run, daemon=True)
          t.start()
          time.sleep(2)
          import subprocess
          res = subprocess.run([
              'locust', '-f', 'perf/locustfile.py', '--headless',
              '-u', '10', '-r', '5', '--run-time', '5s',
              '--host', 'http://127.0.0.1:8000'
          ], capture_output=True, text=True)
          print(res.stdout)
          assert res.returncode == 0
          "
