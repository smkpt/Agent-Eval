[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-agent-poc"
version = "0.1.0"
description = "Healthcare AI Multi-Agent Architecture with DeepEval Guardrails and Asynchronous Workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "python-dateutil>=2.9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
